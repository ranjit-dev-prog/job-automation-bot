@if (confirmService.request(); as req) {
  <div class="confirm-backdrop" (click)="confirmService.respond(false)">
    <div class="confirm-card" (click)="$event.stopPropagation()">
      <h3>{{ req.title }}</h3>
      <p>{{ req.message }}</p>
      <div class="confirm-actions">
        <button class="btn btn-sm" (click)="confirmService.respond(false)">Cancel</button>
        <button
          class="btn btn-sm"
          [class.btn-danger]="req.danger"
          [class.btn-primary]="!req.danger"
          (click)="confirmService.respond(true)"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
