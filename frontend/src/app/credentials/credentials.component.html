<h1>Platform Logins</h1>
<p class="hint">
  Each job platform has its own dedicated login page — saved logins are encrypted at rest and
  used only for auto-login/auto-apply during automation runs.
</p>

<div class="card">
  <div class="platform-grid">
    @for (p of platforms; track p) {
      <a class="platform-card" [routerLink]="routeFor(p)">
        <span class="platform-name">{{ labels[p] }}</span>
        @if (isConnected(p)) {
          <span class="badge badge-applied">Connected</span>
        } @else {
          <span class="badge badge-pending">Not connected</span>
        }
        <span class="manage-link">Manage login →</span>
      </a>
    }
  </div>
</div>
