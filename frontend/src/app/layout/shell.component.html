<div class="shell">
  <aside class="sidebar">
    <div class="brand">Job Automation Bot</div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/profile" routerLinkActive="active">Profile &amp; Resume</a>
      <a routerLink="/credentials" routerLinkActive="active">Platform Logins</a>
      <a routerLink="/filters" routerLinkActive="active">Filters &amp; Auto-Apply</a>
      <a routerLink="/outreach" routerLinkActive="active">Outreach</a>
    </nav>
    <div class="user-box">
      <span>{{ auth.currentUser()?.name ?? auth.currentUser()?.email }}</span>
      <button class="btn btn-sm" (click)="logout()">Log out</button>
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>

<app-toast />
<app-confirm-dialog />
